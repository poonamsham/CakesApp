[versions]
agp = "8.7.3"
coilCompose = "3.0.4"
converterGson = "2.11.0"
coreKtx = "1.15.0"
hilt = "2.52"
hiltNavigationCompose = "1.2.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.9.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
